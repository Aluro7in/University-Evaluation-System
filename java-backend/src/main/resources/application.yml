spring:
  application:
    name: university-evaluation-java
  datasource:
    url: jdbc:h2:file:./data/university-evaluation;MODE=MySQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
university:
  seed-data: ${UNIVERSITY_SEED_DATA:true}
  cors-origins: ${UNIVERSITY_CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}